name: Release

# Every push to main builds a self-contained Wisper.app on an Apple Silicon
# runner and publishes it as a new GitHub Release (vX.Y.<run number>).
# Version base comes from the VERSION file. Docs-only pushes are skipped.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels a build that is still running.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15 # Apple Silicon (arm64)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        run: |
          BASE="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create Python environment
        run: |
          uv venv -p 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Build self-contained app
        env:
          WISPER_VERSION: ${{ env.VERSION }}
        run: ./package_app.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wisper-${{ env.VERSION }}
          path: dist/Wisper.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          NOTES="$(mktemp)"
          {
            echo "Built from \`${GITHUB_SHA::7}\`: $(git log -1 --pretty=%s)"
            echo
            cat RELEASE_NOTES.md
          } > "$NOTES"
          gh release create "$TAG" dist/Wisper.zip \
            --target "$GITHUB_SHA" \
            --title "Wisper $TAG" \
            --notes-file "$NOTES" \
            --latest
